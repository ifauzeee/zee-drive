name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web

  # secrets context is not allowed in job-level `if`, so a tiny gate job
  # exposes whether the Google credentials exist and e2e keys off its output.
  e2e-gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: echo "ok=$([ -n "$GOOGLE_CLIENT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: e2e-gate
    if: needs.e2e-gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Prepare local D1 (migrations + guest login)
        run: |
          npm run db:migrate
          npx wrangler d1 execute zee-index-db --local --command "INSERT INTO settings (key, value) VALUES ('guest','1') ON CONFLICT(key) DO UPDATE SET value='1'"
      - name: Write .dev.vars for local bindings
        run: |
          cat > .dev.vars <<EOF
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          SHARE_SECRET_KEY=${{ secrets.SHARE_SECRET_KEY }}
          EOF
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply zee-index-db --remote
      - run: npm run deploy